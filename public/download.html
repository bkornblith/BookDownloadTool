<!doctype html>
<html>
<head>
	<title>Send to e-reader</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="stylesheet" type="text/css" href="./style.css?v2"/>
	<script src="./common.js?a"></script>
</head>
<body>

<div class="wrapper">
	<h1>Send to e-reader</h1>

	<div class="label">Your key</div>
	<div id="key">
		<span id="keyoutput">––––</span>
		<button id="keygen" title="Generate new key">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
				<path d="M19.146 4.854l-1.489 1.489A8 8 0 1 0 12 20a8.094 8.094 0 0 0 7.371-4.886 1 1 0 1 0-1.842-.779A6.071 6.071 0 0 1 12 18a6 6 0 1 1 4.243-10.243l-1.39 1.39a.5.5 0 0 0 .354.854H19.5A.5.5 0 0 0 20 9.5V5.207a.5.5 0 0 0-.854-.353z"/>
			</svg>
		</button>
	</div>

	<div id="downloads">
		<div class="label">Ready to download</div>
		<a id="downloadlink" class="downloadlink"></a>
	</div>

	<div class="hint">
		Open this site on your phone or computer and enter the key to send a book:<br/>
		<a id="siteurl"></a>
	</div>
</div>

<div id="logs"></div>

<script type="text/javascript">

var keyOutput = document.getElementById('keyoutput')
var keyGenBtn = document.getElementById('keygen')
var downloads = document.getElementById('downloads')
var downloadlink = document.getElementById('downloadlink')
var siteurl = document.getElementById('siteurl')
var key = null
var pollTimer = null
var pollStarted = 0
var slowPoll = false

// Check every 5 seconds, then every 15 after 10 minutes to save Blob operations
function startPolling (interval) {
	if (pollTimer) clearInterval(pollTimer)
	pollTimer = setInterval(pollFile, interval)
}

function pollFile () {
	if (!slowPoll && Date.now() - pollStarted > 10 * 60 * 1000) {
		slowPoll = true
		startPolling(15 * 1000)
	}
	if (!key) {
		keyOutput.textContent = '––––'
		downloads.style.display = 'none'
		return
	}
	xhr('GET', './status/' + key, function (x) {
		var data
		try {
			data = JSON.parse(x.responseText)
		} catch (err) {
			key = null
			keyOutput.textContent = '––––'
			downloads.style.display = 'none'
			return
		}
		if (data.error) {
			if (pollTimer) clearInterval(pollTimer)
			key = null
			keyOutput.textContent = '––––'
			downloads.style.display = 'none'
		}
		if (data.file) {
			downloads.style.display = 'block'
			downloadlink.textContent = data.file.name
			downloadlink.href = '/' + encodeURIComponent(data.file.name) + "?key=" + key
		} else {
			downloads.style.display = 'none'
		}
	})
}

function generateKey () {
	keyOutput.textContent = '––––'
	if (pollTimer) clearInterval(pollTimer)
	downloads.style.display = 'none'
	var url = './generate' + (key ? '?old=' + encodeURIComponent(key) : '')
	xhr('POST', url, function (x) {
		if (x.responseText !== 'error' && x.status === 200) {
			key = x.responseText
			keyOutput.textContent = key
			downloadlink.href = ''
			pollStarted = Date.now()
			slowPoll = false
			startPolling(5 * 1000)
		} else {
			key = null
			keyOutput.textContent = '––––'
			downloadlink.href = ''
		}
		keyGenBtn.blur()
	})
}

window.onload = function () {
	keyGenBtn.onclick = generateKey
	generateKey()
}

siteurl.textContent = window.location.href
siteurl.href = siteurl.textContent
siteurl.target = '_self'

</script>
</body>
</html>
